name: mcpvault-web

# Dedicated CI for the parallel Shibumi-stack website skeleton.
# Deliberately separate from the existing website deployment; this workflow
# never builds or deploys the live Astro website.
on:
  push:
    branches: [main]
    paths:
      - "website-shibumi/**"
      - ".github/workflows/website-shibumi.yml"
  pull_request:
    branches: [main]
    paths:
      - "website-shibumi/**"
      - ".github/workflows/website-shibumi.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-shibumi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Run bun audit
        run: bun audit

  build-only:
    name: Build image (no push)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the repo root (not website-shibumi/) — the
      # Containerfile also copies the root package.json for the published
      # MCP package version read at startup; see the Containerfile header.
      # Catches a broken Containerfile in CI. Deploys happen on the host via
      # shibumi-server (in-situ podman compose build), never from here.
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website-shibumi/Containerfile
          push: false
